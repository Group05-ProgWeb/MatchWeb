<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>MatchWeb - Home Page</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
            crossorigin="anonymous"
    />
</head>
<body class="d-flex flex-column min-vh-100">

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"
></script>

<!-- Navbar -->
<div th:replace="~{fragments/navbar-anon.html :: navbar-anon}"></div>

<!-- Main container -->
<main class="container my-5 flex-grow-1">
    <div class="text-center mb-4">
        <h1 class="display-4">PartiteWeb</h1>
        <p class="lead">Ciao, benvenuto in PartiteWeb!</p>
    </div>

    <!-- Cards for sports -->
    <div class="row justify-content-center g-3">
        <div class="col-12 col-md-4">
            <a href="/football" class="text-decoration-none">
                <div class="card text-white bg-primary h-100">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center">
                        <h3 class="card-title">Calcio</h3>
                        <p class="card-text">Scopri le ultime partite e novità sul calcio.</p>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-12 col-md-4">
            <a href="/basketball" class="text-decoration-none">
                <div class="card text-white bg-success h-100">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center">
                        <h3 class="card-title">Basket</h3>
                        <p class="card-text">Segui il mondo del basket con le ultime notizie.</p>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-12 col-md-4">
            <a href="/volleyball" class="text-decoration-none">
                <div class="card text-white bg-warning h-100">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center">
                        <h3 class="card-title">Pallavolo</h3>
                        <p class="card-text">Resta aggiornato sulle partite di pallavolo.</p>
                    </div>
                </div>
            </a>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer.html :: footer}"></div>

<!-- News -->
<div th:replace="~{fragments/news.html :: news}"></div>

</body>
</html>
