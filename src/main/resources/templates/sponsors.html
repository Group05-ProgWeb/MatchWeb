<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sponsors</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <style>
        img {
            max-height: 100px;
            object-fit: contain;
            width: 100%;
            padding: 10px;
        }

        .card-img-top {
            background-color: #f8f9fa;
        }
    </style>

</head>
<body class="d-flex flex-column min-vh-100">
    <div th:if="${isLoggedIn}">
        <div th:replace="~{fragments/navbar.html :: navbar}"></div>
    </div>

    <div th:unless="${isLoggedIn}">
        <div th:replace="~{fragments/navbar-anon.html :: navbar-anon}"></div>
    </div>
    <main class="container my-5 flex-grow-1">
        <h1>Sponsors</h1>
        <br/><br/>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 text-center">
            <div class="col">
                <a href="https://www.cooptrentinoaltoadige.it/homepage" target="_blank" class="text-decoration-none text-dark">
                    <div class="card h-100 border-0">
                        <img src="https://www.cooptrentinoaltoadige.it/logo/logo-it.svg" class="card-img-top img-fluid" alt="Coop Trentino">
                        <div class="card-body">
                            <p class="card-text fw-semibold">Coop Trentino</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col">
                <a href="https://www.fbk.eu/it/" target="_blank" class="text-decoration-none text-dark">
                    <div class="card h-100 border-0">
                        <img src="https://www.fbk.eu/wp-content/themes/fbk-foundation/images/opengraph-default.png" class="card-img-top img-fluid" alt="SFondazione Bruno Kessler (FBK) ">
                        <div class="card-body">
                            <p class="card-text fw-semibold">Fondazione Bruno Kessler (FBK) </p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col">
                <a href="https://www.sisal.it/" target="_blank" class="text-decoration-none text-dark">
                    <div class="card h-100 border-0">
                        <img src="https://www.sisal.it/etc.clientlibs/sisal-fullresponsive/clientlibs/clientlib-site/resources/images/svg/header/logo-sisal.png" class="card-img-top img-fluid" alt="Sisal">
                        <div class="card-body">
                            <p class="card-text fw-semibold">Sisal</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col">
                <a href="https://www.bancapts.it/privati/" target="_blank" class="text-decoration-none text-dark">
                    <div class="card h-100 border-0">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSJ1HNn4zVqczluasAYoXKVKu7slIIZtgcvqQ&s" class="card-img-top img-fluid" alt="Banca Trentino Suedtirol">
                        <div class="card-body">
                            <p class="card-text fw-semibold">Banca per il Trentino Suedtirol</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/news.html :: news}"></div>
</body>
</html>
