<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <div th:replace="~{fragments/navbar.html :: navbar}"></div>
        <h1>Dashboard</h1>
        <p>Ciao, <span th:text="${firstName}">User</span>!</p>
        <a href="/profile">Visualizza Profilo</a>
        <a href="/game-calendar">Visualizza Calendario Partite</a>
        <a href="/play">Gioca Schedina</a>
        <a href="/reviews">Recensioni</a>
        <form action="/changePassword" method="post">
            <label for="oldPassword">Vecchia password: </label>
            <input id="oldPassword" name="oldPassword" type="password">
            <label for="newPassword">Nuova password: </label>
            <input id="newPassword" name="newPassword" type="password">
            <button type="submit">Cambia password</button>
        </form>
    <div th:replace="~{fragments/news.html :: news}"></div>
</body>
</html>

<style>
    a,label,input,button {
        display: block;
        margin: 8px 0;
    }
</style>
