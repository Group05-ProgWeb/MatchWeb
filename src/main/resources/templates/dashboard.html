<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>MatchWeb - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
<div th:replace="~{fragments/navbar.html :: navbar}"></div>

<div class="container mt-4">
    <h1 class="mb-4">Ciao, <span th:text="${firstName}">User</span>!</h1>

    <div class="mb-4">
        <a href="/profile" class="btn btn-primary me-2 mb-2">Visualizza Profilo</a>
        <a href="/game-calendar" class="btn btn-secondary me-2 mb-2">Visualizza Calendario Partite</a>
        <a href="/play" class="btn btn-success me-2 mb-2">Gioca Schedina</a>
        <a href="/reviews" class="btn btn-info mb-2">Recensioni</a>
    </div>

    <div class="card" style="max-width: 400px;">
        <div class="card-body">
            <h5 class="card-title">Cambia Password</h5>
            <form action="/change-password" method="post">
                <div class="mb-3">
                    <label for="oldPassword" class="form-label">Vecchia password</label>
                    <input id="oldPassword" name="oldPassword" type="password" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label">Nuova password</label>
                    <input id="newPassword" name="newPassword" type="password" class="form-control" required />
                </div>
                <button type="submit" class="btn btn-danger">Cambia password</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
