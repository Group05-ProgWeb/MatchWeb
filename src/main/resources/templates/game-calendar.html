<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Calendario partite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/navbar-anon.html :: navbar-anon}"></div>

    <main class="container my-5 flex-grow-1">
        <table class="table">
            <thead>
                <tr>
                    <th>Giornata</th>
                    <th>Casa</th>
                    <th>Ospite</th>
                </tr>
            </thead>
            <tbody id="matches-body">
            <tr th:each="m : ${matches}" th:data-match-id="${m.getMatchId()}">
                <td th:text="${m.getMatchDay()}">Giornata</td>
                <td th:text="${m.getHome().getName()}">Casa</td>
                <td th:text="${m.getAway().getName()}">Ospite</td>
            </tr>
            </tbody>
        </table>
    </main>

    <div th:replace="~{fragments/footer.html :: footer}"></div>

    <div th:replace="~{fragments/news.html :: news}"></div>

</body>
</html>
