<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Classifica Utenti</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
</head>
<body>
<div th:replace="~{fragments/navbar-admin.html :: navbar-admin}"></div>

<main class="container my-5" style="max-width: 900px;">
    <h1 class="mb-4">Classifica Utenti</h1>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>Posizione</th>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Username</th>
            <th>Punti Totali</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user, iterStat : ${users}">
            <td th:text="${iterStat.count}">1</td>
            <td th:text="${user.firstName}">Nome</td>
            <td th:text="${user.lastName}">Cognome</td>
            <td th:text="${user.username}">username</td>
            <td th:text="${user.totalScore}">0</td>
        </tr>
        </tbody>
    </table>
</main>

<div th:replace="~{fragments/news.html :: news}"></div>

</body>
</html>
