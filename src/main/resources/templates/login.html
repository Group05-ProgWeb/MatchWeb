<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
  />
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar.html :: navbar}"></div>

<main class="container my-5" style="max-width: 400px;">
  <h1 class="mb-4 text-center">Login</h1>
  <form method="post" class="needs-validation" novalidate>
    <div class="mb-3">
      <label for="username" class="form-label">Nome utente</label>
      <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              required
      />
      <div class="invalid-feedback">Inserisci il nome utente.</div>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              required
      />
      <div class="invalid-feedback">Inserisci la password.</div>
    </div>
    <button type="submit" class="btn btn-primary w-100">Login</button>
  </form>
</main>

<div th:replace="~{fragments/news.html :: news}"></div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
></script>

<script>
  // Example Bootstrap validation script
  (() => {
    'use strict';
    const forms = document.querySelectorAll('.needs-validation');
    Array.from(forms).forEach(form => {
      form.addEventListener(
              'submit',
              event => {
                if (!form.checkValidity()) {
                  event.preventDefault();
                  event.stopPropagation();
                }
                form.classList.add('was-validated');
              },
              false
      );
    });
  })();
</script>
</body>
</html>
