<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
</head>
<body>
  <div th:replace="~{fragments/navbar.html :: navbar}"></div>
  <h1>Sign Up</h1>
  <form action="/signup" method="post">
    <div>
      <label for="name">Nome</label>
      <br>
      <input type="text" id="name" name="name" required>
    </div>
    <div>
      <label for="surname">Cognome</label>
      <br>
      <input type="text" id="surname" name="surname" required>
    </div>
    <div>
      <label for="dateOfBirth">Data di nascita</label>
      <br>
      <input type="date" id="dateOfBirth" name="dateOfBirth" required>
    </div>
    <div>
      <label for="email">Email</label>
      <br>
      <input type="email" id="email" name="email" pattern=".*@.*" required>
    </div>
    <div>
      <label for="username">Nome utente</label>
      <br>
      <input type="text" id="username" name="username" required>
    </div>
    <div>
      <label for="password">Password</label>
      <br>
      <input type="password" id="password" name="password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required>
    </div>
    <div>
      <label for="sport">Seleziona uno sport:</label>
      <br>
      <select id="sport" name="sport">
        <option>Calcio</option>
        <option>Basket</option>
        <option>Pallavvolo</option>
      </select>
    </div>
    <div>
      <label for="favoriteTeam">Seleziona una squadra preferita:</label>
      <br>
      <select id="favoriteTeam" name="favoriteTeam">
        <option>I fantastici</option>
      </select>
    </div>
    <button type="submit">Registrati</button>
    <button type="reset">Reimposta campi</button>
  </form>
  <div th:replace="~{fragments/news.html :: news}"></div>
</body>
</html>
