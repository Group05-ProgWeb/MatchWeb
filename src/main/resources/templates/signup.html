<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up</title>
  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
  />
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar-anon.html :: navbar-anon}"></div>

<main class="container my-5" style="max-width: 600px;">
  <h1 class="mb-4 text-center">Sign Up</h1>
  <form action="/signup" method="post" class="needs-validation" novalidate>

    <div class="mb-3">
      <label for="name" class="form-label">Nome</label>
      <input
              type="text"
              class="form-control"
              id="name"
              name="name"
              required
      />
      <div class="invalid-feedback">Inserisci il nome.</div>
    </div>

    <div class="mb-3">
      <label for="surname" class="form-label">Cognome</label>
      <input
              type="text"
              class="form-control"
              id="surname"
              name="surname"
              required
      />
      <div class="invalid-feedback">Inserisci il cognome.</div>
    </div>

    <div class="mb-3">
      <label for="dateOfBirth" class="form-label">Data di nascita</label>
      <input
              type="date"
              class="form-control"
              id="dateOfBirth"
              name="dateOfBirth"
              required
      />
      <div class="invalid-feedback">Inserisci la data di nascita.</div>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              pattern=".*@.*"
              required
      />
      <div class="invalid-feedback">Inserisci una email valida.</div>
    </div>

    <div class="mb-3">
      <label for="username" class="form-label">Nome utente</label>
      <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              required
      />
      <div class="invalid-feedback">Inserisci il nome utente.</div>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
              required
      />
      <div class="form-text">
        La password deve contenere almeno 8 caratteri, una lettera maiuscola, una minuscola e un numero.
      </div>
      <div class="invalid-feedback">Inserisci una password valida.</div>
    </div>

    <div class="mb-3">
      <label for="sport" class="form-label">Seleziona uno sport:</label>
      <select id="sport" name="sport" class="form-select">
        <option value="Calcio">Calcio</option>
        <option value="Basket" disabled>Basket</option>
        <option value="Pallavvolo" disabled>Pallavvolo</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="favoriteTeam" class="form-label">Seleziona una squadra preferita:</label>
      <select id="favoriteTeam" name="favoriteTeam" class="form-select">
        <option value="" disabled selected>-- Seleziona --</option>
        <option th:each="team : ${teams}"
                th:value="${team.getName()}"
                th:text="${team.getName()}">
        </option>
      </select>
    </div>

    <div class="d-flex justify-content-between">
      <button type="submit" class="btn btn-primary">Registrati</button>
      <button type="reset" class="btn btn-secondary">Reimposta campi</button>
    </div>
  </form>
</main>

<div th:replace="~{fragments/news.html :: news}"></div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
></script>

<script>
  // Bootstrap validation
  (() => {
    'use strict';
    const forms = document.querySelectorAll('.needs-validation');
    Array.from(forms).forEach(form => {
      form.addEventListener(
              'submit',
              event => {
                if (!form.checkValidity()) {
                  event.preventDefault();
                  event.stopPropagation();
                }
                form.classList.add('was-validated');
              },
              false
      );
    });
  })();
</script>
</body>
</html>
