<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Assegna Premi</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
</head>
<body>
<div th:replace="~{fragments/navbar-admin.html :: navbar-admin}"></div>

<main class="container my-5" style="max-width: 600px;">
    <h1 class="mb-4 text-center">Assegna Premi</h1>

    <button id="assignPrizesBtn" class="btn btn-primary w-100 mb-4">
        Assegna premi ai primi 3 utenti
    </button>

    <div id="result" class="alert alert-info d-none" role="alert"></div>
</main>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
></script>

<script>
    const btn = document.getElementById('assignPrizesBtn');
    const resultDiv = document.getElementById('result');

    btn.addEventListener('click', () => {
        btn.disabled = true;
        resultDiv.classList.remove('d-none');
        resultDiv.textContent = 'Sto assegnando i premi...';

        fetch('/admin/prizes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
        })
            .then(response => {
                if (!response.ok) throw new Error('Errore nella richiesta');
                return response.json();
            })
            .then(data => {
                if (Array.isArray(data)) {
                    resultDiv.innerHTML = data.map(msg => `<p>${msg}</p>`).join('');
                } else {
                    resultDiv.textContent = 'Nessun premio assegnato.';
                }
            })
            .catch(err => {
                resultDiv.textContent = 'Errore durante l\'assegnazione: ' + err.message;
            })
            .finally(() => {
                btn.disabled = false;
            });
    });
</script>
</body>
</html>
