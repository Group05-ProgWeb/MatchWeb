<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Upgrade Utenti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div th:replace="~{fragments/navbar-admin.html :: navbar-admin}"></div>

<main class="container my-5" style="max-width: 500px;">
    <h1>Upgrade Utenti</h1>

    <form method="post" th:action="@{/admin/upgrade}">
        <div class="mb-3">
            <label for="userSelect" class="form-label">Seleziona Utente</label>
            <select id="userSelect" name="userName" class="form-select" required>
                <option value="" disabled selected>-- Seleziona utente --</option>
                <option th:each="user : ${users}" th:value="${user.username}"
                        th:text="${user.firstName} + ' ' + ${user.lastName} + ' (' + ${user.username} + ')'">
                    Nome Cognome (username)
                </option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Upgrade a Moderatore</button>
    </form>

    <div class="mt-4" th:if="${message}">
        <div class="alert alert-success" th:text="${message}"></div>
    </div>
</main>
</body>
</html>
